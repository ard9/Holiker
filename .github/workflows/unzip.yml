name: Unzip project
on:
  push:
    paths: [".github/workflows/unzip.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract holiker.zip into repo root
        run: |
          unzip -q holiker.zip -d /tmp/x
          cp -a /tmp/x/holiker/. .
          git rm -q holiker.zip .github/workflows/unzip.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Holiker project files from zip"
          git push
